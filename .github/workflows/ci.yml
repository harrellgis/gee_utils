name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync

      - name: Lint (ruff)
        run: uv run ruff check src/ tests/

      - name: Format check (black)
        run: uv run black --check src/ tests/

      - name: Type check (mypy)
        run: uv run mypy src/

      # Earth Engine tests (-m "ee") require authenticated GEE credentials and a
      # registered Cloud project, which CI does not have, so they are excluded.
      # Run them locally with EE_PROJECT set (see README / CLAUDE.md).
      - name: Test (non-Earth-Engine)
        run: uv run pytest -m "not ee"
