[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "eetools"
description = "Reusable Google Earth Engine utilities for satellite data processing and analysis"
readme = "README.md"
requires-python = ">=3.11"
dynamic = ["version"]
dependencies = [
    "earthengine-api>=0.1.370",
    "geopandas>=0.14.0",
    "shapely>=2.0.0",
    "pandas>=2.0.0",
    "numpy>=1.26.0",
    "matplotlib>=3.8.0",
    "seaborn>=0.13.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "black>=24.0.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
]

[tool.hatch.version]
path = "src/eetools/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/eetools"]

[tool.black]
line-length = 88
target-version = ["py311"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]
# Line length is owned by the formatter (black). The only E501s that remain are
# in docstrings/strings the formatter intentionally won't reflow, so flagging
# them is noise; `black --check` enforces code width in CI instead.
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
files = ["src"]
warn_redundant_casts = true
warn_unused_ignores = true
no_implicit_optional = true

# Earth Engine and several geospatial deps ship no type information, so their
# imports resolve to Any. Exempt them rather than littering the code with
# per-line ignores; our own annotations are still checked.
[[tool.mypy.overrides]]
module = ["ee.*", "geopandas.*", "shapely.*", "seaborn.*", "pandas.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "ee: requires a live Earth Engine session (set EE_PROJECT to run; skipped otherwise)",
    "slow: hits real Earth Engine datasets over the network (implies ee)",
]
